<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- SmartShelf Exact Vector Logo -->
  <g id="emblem">
    <!-- Ground Baseline -->
    <rect x="4" y="68" width="76" height="6" rx="3" fill="#146B38" />

    <!-- 3 Vertical Growth Bar Chart Elements -->
    <!-- Bar 1 (Short) -->
    <rect x="42" y="55" width="7" height="14" rx="3.5" fill="#146B38" />
    <!-- Bar 2 (Medium) -->
    <rect x="53" y="47" width="7" height="22" rx="3.5" fill="#146B38" />
    <!-- Bar 3 (Tall) -->
    <rect x="64" y="39" width="7" height="30" rx="3.5" fill="#146B38" />

    <!-- Curved Stem -->
    <path d="M 18 52 C 14 60 12 65 11 69" stroke="#146B38" stroke-width="4.5" stroke-linecap="round" />

    <!-- Green Leaf -->
    <path
      d="M 18 52 C 14 36 29 18 57 16 C 68 15 74 24 72 37 C 70 51 49 57 26 56 C 21 55 19 54 18 52 Z"
      fill="#22A058"
      stroke="#146B38"
      stroke-width="3.8"
      stroke-linejoin="round"
    />

    <!-- White Inner Leaf Veins -->
    <path d="M 21 50 C 34 42 47 32 60 24" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 33 42 C 34 35 38 30 44 27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 45 33 C 48 28 52 24 58 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 35 41 C 39 47 44 50 50 51" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 47 32 C 52 39 57 42 63 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wordmark "SmartShelf" -->
  <g id="wordmark" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.5px">
    <text x="92" y="54" fill="#146B38">Smart</text>
    <text x="195" y="54" fill="#22A058" font-weight="600">Shelf</text>
  </g>
</svg>
